name: Kavanah checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  application-and-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run test:backend
      - name: Check social and account code
        run: npx eslint src/screens/PeopleScreen.tsx src/screens/ProfileScreen.tsx src/services/network src/store/circleAccountStore.ts src/store/socialStore.ts src/providers/AppProviders.tsx src/screens/CircleScreen.tsx scripts/backend/generateCatalog.ts
